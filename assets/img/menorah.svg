<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Menorah">
  <title>Menorah</title>
  <g fill="none" stroke="#0038b8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- central stem and foot -->
    <path d="M50 25 V78"/>
    <path d="M40 86 L44 78 H56 L60 86 Z"/>
    <path d="M34 90 H66"/>
    <!-- three branches each side. Each arc is centred on the lamp line, so it
         leaves the stem horizontally and arrives at its lamp vertically. -->
    <path d="M50 36.5 A10 11.5 0 0 1 40 25"/>
    <path d="M50 48   A20 23   0 0 1 30 25"/>
    <path d="M50 59.5 A30 34.5 0 0 1 20 25"/>
    <path d="M50 36.5 A10 11.5 0 0 0 60 25"/>
    <path d="M50 48   A20 23   0 0 0 70 25"/>
    <path d="M50 59.5 A30 34.5 0 0 0 80 25"/>
    <!-- seven lamps -->
    <path d="M20 25 V17M30 25 V17M40 25 V17M50 25 V17M60 25 V17M70 25 V17M80 25 V17"/>
  </g>
</svg>
