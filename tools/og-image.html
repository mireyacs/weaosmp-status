<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WeaoSMP.xyz — social thumbnail source</title>
<!--
  Source for assets/img/og-image.png. Rendered at exactly 1200x630, the size
  Discord, Twitter/X, Slack and iMessage all expect for a large link preview.
  Regenerate with tools/render-og.sh after editing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #fff;
    --fg-alt: #fffc;
    --fg-muted: #fff9;
    --fg-subtle: #fff6;
    --green: #3bea57;
    --red: #ec3b47;
    --border: #ffffff1a;
    --card: #21242580;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Poppins", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* the site's own green/red glow, pushed a little brighter so it survives
     being scaled down to a few hundred pixels in a chat client */
  .glow {
    position: absolute;
    inset: -20% -10% auto -10%;
    height: 150%;
    opacity: .3;
    background:
      radial-gradient(52% 62% at 10% 0%, rgba(59, 234, 87, .85) 0%, transparent 62%),
      radial-gradient(52% 62% at 90% 0%, rgba(236, 59, 71, .85) 0%, transparent 62%);
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: .05;
    background-image:
      linear-gradient(to right, #fff 1px, transparent 1px),
      linear-gradient(to bottom, #fff 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(70% 70% at 50% 40%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(70% 70% at 50% 40%, #000 30%, transparent 100%);
  }

  .frame {
    position: relative;
    height: 100%;
    padding: 66px 80px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top { display: flex; align-items: center; gap: 30px; }
  .icon {
    width: 128px; height: 128px;
    border-radius: 26px;
    border: 1px solid var(--border);
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 18px 44px rgba(0, 0, 0, .5);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 13px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 0 40px -8px #22c55e;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .badge i {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #fff;
    display: block;
  }

  h1 {
    font-size: 110px;
    font-weight: 600;
    letter-spacing: -.03em;
    line-height: 1;
  }
  .red { color: var(--red); }
  .green { color: var(--green); }

  .sub {
    margin-top: 20px;
    font-size: 37px;
    font-weight: 400;
    color: var(--fg-alt);
    letter-spacing: -.01em;
  }

  .chips { display: flex; gap: 14px; margin-top: 36px; }
  .chip {
    padding: 13px 24px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 24px;
    font-weight: 500;
    color: var(--fg-muted);
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
  }
  .url {
    font-family: "JetBrains Mono", monospace;
    font-size: 27px;
    color: var(--fg-subtle);
  }
  .rule {
    height: 6px;
    width: 210px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--green), var(--red));
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="frame">
    <div class="top">
      <img class="icon" src="../assets/img/server-icon.webp" alt="" />
      <span class="badge"><i></i> Live Status</span>
    </div>

    <div>
      <h1>Weao<span class="red">SMP</span><span class="green">.xyz</span></h1>
      <p class="sub">Minecraft server status &mdash; live players, uptime &amp; stats</p>
      <div class="chips">
        <span class="chip">Who's playing</span>
        <span class="chip">Uptime history</span>
        <span class="chip">Refreshes every 60s</span>
      </div>
    </div>

    <div class="foot">
      <span class="url">mireyacs.github.io/weaosmp-status</span>
      <span class="rule"></span>
    </div>
  </div>
</body>
</html>
